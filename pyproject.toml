[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etholive"
version = "0.4.0"
description = "Causal real-time behavior classification from animal pose (mouse and fly)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ava Sajjadi" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "pyarrow>=14,<27",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
# pose network (Section 1) and video input; ultralytics is AGPL-3.0 and brings torchvision
video = ["opencv-python-headless>=4.8,<5", "ultralytics>=8.3,<9"]
# figures for the paper
figures = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["etholive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
